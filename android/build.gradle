group = "com.nosmai.nosmai_effects_sdk"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.nosmai.nosmai_effects_sdk"
    }

    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "NOSMAI_INTERNAL_LOGS", "true"
        }
        release {
            buildConfigField "boolean", "NOSMAI_INTERNAL_LOGS", "false"
        }
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    dependencies {
        // Resolve the verified production SDK from the official GitHub release.
        implementation("com.nosmai:nosmai-sdk:3.0.5@aar")

        // Test dependencies
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// Gradle resolves transitive Android dependencies using the consuming app's
// repositories. Register the official release repository for every project so
// applications do not need to keep or wire a local AAR.
rootProject.allprojects {
    repositories {
        ivy {
            name = "nosmaiEffectsSdk"
            url = uri("https://github.com/nosmai/nosmai_effects_sdk_android/releases/download")
            patternLayout {
                artifact("v[revision]/[artifact]-[revision].[ext]")
            }
            metadataSources {
                artifact()
            }
            content {
                includeModule("com.nosmai", "nosmai-sdk")
            }
        }
    }
}
